[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-python-launcher"
version = "0.1.0"
description = "In-cluster web launcher for discovering and launching Harbor-hosted AP Python apps via Kubernetes Jobs"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Fermi National Accelerator Laboratory" }
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "kubernetes>=29.0.0",
  "requests>=2.31",
]

[project.scripts]
ap-python-launcher = "ap_python_launcher.server:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ap_launcher*"]
