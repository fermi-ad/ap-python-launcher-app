#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  # Rust checks
  { id = "rustfmt", name = "cargo fmt", entry = "bash -lc 'cd backend && cargo fmt --all -- --check'", language = "system", pass_filenames = false, stages = ["pre-commit"] },
  { id = "clippy", name = "cargo clippy", entry = "bash -lc 'cd backend && cargo clippy --all-targets --all-features -- -D warnings'", language = "system", pass_filenames = false, stages = ["pre-commit"] },
  { id = "rust-test", name = "cargo test", entry = "bash -lc 'cd backend && cargo test --all-features'", language = "system", pass_filenames = false, stages = ["pre-commit"] },

  # Flutter/Dart checks
  { id = "dart-pre-commit", name = "dart_pre_commit", entry = "bash scripts/pre_commit_dart.sh", language = "system", pass_filenames = false, stages = ["pre-commit"] },
]
