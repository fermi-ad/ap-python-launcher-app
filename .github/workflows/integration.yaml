name: Continuous Integration for Flutter applications

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  test:
    uses: fermi-ad/.github/.github/workflows/flutter-integration.yaml@v1
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        test: 
          - smoke_test
    # Change to true to pull in git submodules during build
    with:
      pull-git-submodules: false
      coverage-exclude: "|tool/setup_git_hooks.dart"
