<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AP Python Launcher</title>
    <link rel="stylesheet" href="static/styles.css" />
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>AP Python Launcher</h1>
            <p class="sub">Select an app to launch.</p>
        </header>

        <section class="panel">
            <div class="row">
                <button id="refresh">Refresh</button>
                <span id="status" class="status">Ready</span>
            </div>

            <table class="apps">
                <thead>
                    <tr>
                        <th>Repository</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="apps"></tbody>
            </table>
        </section>

        <section class="panel">
            <h2>Launch status</h2>
            <pre id="launch" class="mono">No new launches</pre>
        </section>
    </main>

    <script src="static/app.js"></script>
</body>

</html>
